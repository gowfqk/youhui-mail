plugins {
    id 'com.android.application'
}

// The Firebase configuration is private to the owner's Firebase project and is intentionally
// not committed. Builds without it still work as the original WebView client, but FCM is inactive.
if (file('google-services.json').isFile()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle('google-services.json not found: building without active FCM configuration.')
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.work:work-runtime:2.10.1'
}

android {
    namespace 'com.youhui.mail'
    compileSdk 35

    defaultConfig {
        applicationId 'com.youhui.mail'
        minSdk 27
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
