name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*-native' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK (android-native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # runner 镜像不再预装 Android SDK，需显式安装 cmdline-tools 提供 sdkmanager
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Detect version
        id: ver
        shell: bash
        run: |
          VERSION=$(grep -E "versionName" app/build.gradle | sed -E "s/.*versionName '([^']+)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: youhui-mail-native-debug-${{ steps.ver.outputs.version }}-${{ github.run_number }}
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
