plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

// Firebase 配置按项目私有文件处理（与 android/ WebView 版相同的条件应用逻辑）：
// 有 google-services.json 时自动启用 Google Services 插件与 FCM；没有时工程仍可编译。
if (file('google-services.json').isFile()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle('google-services.json not found: building without active FCM configuration.')
}

android {
    namespace 'com.youhui.mail'
    compileSdk 36

    defaultConfig {
        applicationId 'com.youhui.mail'
        minSdk 27
        targetSdk 35
        versionCode 10
        versionName '2.2.4-native'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 发布前配置签名：signingConfig signingConfigs.release（签名文件勿入库）
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'androidx.browser:browser:1.8.0'

    // Room 离线缓存（列表/详情）
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    // Firebase 推送（阶段 4 接入 PushMessagingService/PushSyncWorker；版本与 android/ WebView 版一致）
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    // 后续阶段预留（见 README）：
    // OAuth 回环：net.openid:appauth
}
